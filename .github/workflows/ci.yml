name: Jourfold CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: jourfold
    steps:
      - uses: actions/checkout@v4
        with:
          path: jourfold
      # Changes that span both repositories use the same branch name in each. Build against that TravelRepo
      # branch when it exists, otherwise against its default branch.
      - id: travelrepo
        shell: bash
        working-directory: .
        env:
          REPO: ${{ vars.TRAVELREPO_REPOSITORY }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git ls-remote --exit-code --heads "https://github.com/$REPO.git" "$BRANCH" > /dev/null; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.TRAVELREPO_REPOSITORY }}
          ref: ${{ steps.travelrepo.outputs.ref }}
          path: travelrepo
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: jourfold/global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pyyaml==6.0.2
      - run: dotnet restore --locked-mode
      - run: dotnet build Jourfold.sln -c Release --no-restore
      - run: dotnet format Jourfold.sln --verify-no-changes --no-restore
      # A test that hangs, for example on a system dialog nobody can answer, fails and is named instead of blocking.
      - run: dotnet test Jourfold.sln -c Release --no-build --logger trx --blame-hang-timeout 20m
      - run: python eng/verify.py
      - run: python eng/package.py --rid ${{ matrix.rid }}
      # On macOS the real install script installs the package, and the installed, signed app has to start.
      - if: runner.os == 'macOS'
        shell: bash
        run: |
          cd artifacts && shasum -a 256 jourfold-${{ matrix.rid }}.tar.gz > SHA256SUMS
          HOME="$RUNNER_TEMP/home" JOURFOLD_DOWNLOAD_BASE="file://$PWD" bash ../install/install.sh
          app="$RUNNER_TEMP/home/Applications/Jourfold.app"
          codesign --verify --strict --verbose=2 "$app"
          # Serving a trip that does not exist ends with exit code 2 once the runtime has started.
          code=0; perl -e 'alarm 120; exec @ARGV' "$app/Contents/MacOS/Jourfold.Desktop" --mcp "$RUNNER_TEMP/no-trip" < /dev/null || code=$?
          echo "exit code $code"; [ "$code" -eq 2 ]
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DAppVersion=$(python eng/version.py)" "/DAppUrl=$(python eng/version.py --website)" eng/windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: jourfold-${{ matrix.rid }}
          path: jourfold/artifacts/
