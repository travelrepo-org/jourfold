name: Jourfold CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: jourfold
    steps:
      - uses: actions/checkout@v4
        with:
          path: jourfold
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.TRAVELREPO_REPOSITORY }}
          path: travelrepo
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: jourfold/global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: dotnet restore --locked-mode
      - run: dotnet build Jourfold.sln -c Release --no-restore
      - run: dotnet format Jourfold.sln --verify-no-changes --no-restore
      - run: dotnet test Jourfold.sln -c Release --no-build --logger trx
      - run: python eng/verify.py
      - run: python eng/package.py --rid ${{ matrix.rid }}
      - if: runner.os == 'Windows'
        run: |
          choco install innosetup --yes --no-progress
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' eng/windows.iss
      - uses: actions/upload-artifact@v4
        with:
          name: jourfold-${{ matrix.rid }}
          path: jourfold/artifacts/
