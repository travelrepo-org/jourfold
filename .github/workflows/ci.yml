name: Jourfold CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: jourfold
    steps:
      - uses: actions/checkout@v4
        with:
          path: jourfold
      # Changes that span both repositories use the same branch name in each. Build against that TravelRepo
      # branch when it exists, otherwise against its default branch.
      - id: travelrepo
        shell: bash
        working-directory: .
        env:
          REPO: ${{ vars.TRAVELREPO_REPOSITORY }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git ls-remote --exit-code --heads "https://github.com/$REPO.git" "$BRANCH" > /dev/null; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.TRAVELREPO_REPOSITORY }}
          ref: ${{ steps.travelrepo.outputs.ref }}
          path: travelrepo
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: jourfold/global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: dotnet restore --locked-mode
      - run: dotnet build Jourfold.sln -c Release --no-restore
      - run: dotnet format Jourfold.sln --verify-no-changes --no-restore
      - run: dotnet test Jourfold.sln -c Release --no-build --logger trx
      - run: python eng/verify.py
      - run: python eng/package.py --rid ${{ matrix.rid }}
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DAppVersion=$(python eng/version.py)" eng/windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: jourfold-${{ matrix.rid }}
          path: jourfold/artifacts/
