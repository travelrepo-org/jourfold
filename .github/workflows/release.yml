name: Release
# Builds Linux and Windows packages (x64 and ARM64) for a version tag and publishes them with the install scripts.
# The tag must be v + <Version> from Directory.Build.props. The scripts attached to the release name this
# repository, so
#   curl -fsSL https://github.com/<owner>/<repo>/releases/latest/download/install.sh | bash
#   irm https://github.com/<owner>/<repo>/releases/latest/download/install.ps1 | iex
# always install the latest published release.
#
# ARM64 packages are cross-compiled on x64 runners and not tested there. To build and test them natively, set the
# repository variables LINUX_ARM64_RUNNER (for example ubuntu-24.04-arm) and WINDOWS_ARM64_RUNNER (windows-11-arm).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to create, for example v0.2.0. It must match Directory.Build.props.
        required: true
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: jourfold
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.TRAVELREPO_REPOSITORY }}
          path: travelrepo
      - id: check
        working-directory: jourfold
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          tag="${REQUESTED:-$GITHUB_REF_NAME}"
          python3 eng/version.py --check-tag "$tag" --github
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
  package:
    needs: version
    strategy:
      matrix:
        include:
          - rid: linux-x64
            arch: X64
            os: ubuntu-latest
          - rid: linux-arm64
            arch: ARM64
            os: ${{ vars.LINUX_ARM64_RUNNER || 'ubuntu-latest' }}
          - rid: win-x64
            arch: X64
            os: windows-latest
          - rid: win-arm64
            arch: ARM64
            os: ${{ vars.WINDOWS_ARM64_RUNNER || 'windows-latest' }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: jourfold
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: jourfold
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.TRAVELREPO_REPOSITORY }}
          path: travelrepo
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: jourfold/global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: dotnet restore --locked-mode
      - run: dotnet build Jourfold.sln -c Release --no-restore
      # Tests run where the runner matches the package architecture.
      - if: runner.arch == matrix.arch
        run: dotnet test Jourfold.sln -c Release --no-build
      - run: python eng/package.py --rid ${{ matrix.rid }}
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $arch = '${{ matrix.rid }}'.Substring(4)
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DAppVersion=$(python eng/version.py)" "/DArch=$arch" eng/windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          if-no-files-found: error
          path: |
            jourfold/artifacts/jourfold-${{ matrix.rid }}.tar.gz
            jourfold/artifacts/jourfold_*.deb
            jourfold/artifacts/jourfold-${{ matrix.rid }}.zip
            jourfold/artifacts/jourfold-setup-${{ matrix.rid }}.exe
  publish:
    needs: [version, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Prepare install scripts and checksums
        run: |
          sed "s|@JOURFOLD_REPOSITORY@|${GITHUB_REPOSITORY}|g" install/install.sh > dist/install.sh
          sed "s|@JOURFOLD_REPOSITORY@|${GITHUB_REPOSITORY}|g" install/install.ps1 > dist/install.ps1
          chmod +x dist/install.sh
          cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          flags=""
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "Jourfold ${TAG#v}" --generate-notes $flags
