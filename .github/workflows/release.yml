name: Release
# Runs when a maintainer publishes a GitHub release. The release tag must be v + <Version> from
# Directory.Build.props, and the TravelRepo release v + <TravelRepoVersion> must already exist; Jourfold is
# built against exactly that TravelRepo tag. The workflow builds Linux, Windows and macOS packages (x64 and ARM64),
# the signed Android APK (android.yml, which waits for approval in the release environment) and the unsigned iPhone
# and iPad app (ios.yml, an IPA to sign and install with an Apple ID) for the tagged commit and attaches them,
# SHA256SUMS and the one-line install scripts to the release:
#   curl -fsSL https://github.com/<owner>/<repo>/releases/latest/download/install.sh | bash
#   irm https://github.com/<owner>/<repo>/releases/latest/download/install.ps1 | iex
# The first step turns the published release into a pre-release, however it was published: the installers only use
# the latest full release, so they never see it before its files are attached. Once everything is attached, a tag
# without a suffix (v1.2.3) becomes a full, latest release; tags with a suffix (v1.2.3-beta.1) stay pre-releases.
# Title and notes may be left empty: a release without a title is named "Jourfold <version> “<code name>”", and the
# notes from docs/releases are written below whatever the release already says. If anything fails, the release goes
# back to draft; fix the problem and publish it again.
#
# The macOS packages are built on an Apple silicon runner, where the Intel (x64) one is cross-compiled and not tested.
# ARM64 Linux and Windows packages are cross-compiled on x64 runners and not tested there. To build and test them natively, set the
# repository variables LINUX_ARM64_RUNNER (for example ubuntu-24.04-arm) and WINDOWS_ARM64_RUNNER (windows-11-arm).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of a published release to check and build again, for example v0.2.0
        required: true
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      travelrepo: ${{ steps.travelrepo.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Before anything else, so that a release published as a full release leaves "latest" to the previous one at
      # once and the installers do not pick it up without its files.
      - name: Make the release a pre-release until its files are attached
        if: github.event_name == 'release' && github.event.release.prerelease != true
        run: gh release edit "$TAG" --prerelease --latest=false --repo "$GITHUB_REPOSITORY"
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          path: jourfold
      - id: travelrepo
        working-directory: jourfold
        env:
          REPO: ${{ vars.TRAVELREPO_REPOSITORY }}
        run: |
          tag="v$(python3 eng/version.py --travelrepo)"
          if ! git ls-remote --exit-code --tags "https://github.com/$REPO.git" "refs/tags/$tag" > /dev/null; then
            echo "::error::Jourfold needs TravelRepo $tag (TravelRepoVersion), but $REPO has no such tag. Publish that TravelRepo release first."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.TRAVELREPO_REPOSITORY }}
          ref: ${{ steps.travelrepo.outputs.tag }}
          path: travelrepo
      - working-directory: jourfold
        run: python3 eng/version.py --check-tag "$TAG" --github
      # Nothing is built when the release notes for this version are missing or incomplete.
      - name: Check the release notes
        working-directory: jourfold
        run: |
          python3 -m pip install --quiet pyyaml==6.0.2
          python3 eng/changelog.py --check --github
      - name: Write the release text below what is already there
        if: github.event_name == 'release'
        working-directory: jourfold
        run: |
          gh release view "$TAG" --json body --jq .body --repo "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/existing.md"
          python3 eng/changelog.py --release-body "$TAG" --repository "$GITHUB_REPOSITORY" --existing "$RUNNER_TEMP/existing.md" > "$RUNNER_TEMP/body.md"
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/body.md" --repo "$GITHUB_REPOSITORY"
      - name: Title the release with its code name when it has no title
        if: github.event_name == 'release'
        working-directory: jourfold
        env:
          TITLE: ${{ github.event.release.name }}
        run: |
          name="$(python3 eng/version.py --codename)"
          echo "Code name: $name" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$TITLE" ] || [ "$TITLE" = "$TAG" ]; then
            # shellcheck disable=SC1111 # typographic quotes are part of the title
            gh release edit "$TAG" --title "Jourfold ${TAG#v} “$name”" --repo "$GITHUB_REPOSITORY"
          fi
  package:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            arch: X64
            os: ubuntu-latest
          - rid: linux-arm64
            arch: ARM64
            os: ${{ vars.LINUX_ARM64_RUNNER || 'ubuntu-latest' }}
          - rid: win-x64
            arch: X64
            os: windows-latest
          - rid: win-arm64
            arch: ARM64
            os: ${{ vars.WINDOWS_ARM64_RUNNER || 'windows-latest' }}
          - rid: osx-arm64
            arch: ARM64
            os: macos-latest
          - rid: osx-x64
            arch: X64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: jourfold
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          path: jourfold
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.TRAVELREPO_REPOSITORY }}
          ref: ${{ needs.version.outputs.travelrepo }}
          path: travelrepo
      - name: Use the pinned SDK
        shell: bash
        run: cp eng/sdk.json global.json
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: jourfold/eng/sdk.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: dotnet restore --locked-mode
      - run: dotnet build Jourfold.sln -c Release --no-restore
      # Tests run where the runner matches the package architecture.
      - if: runner.arch == matrix.arch
        run: dotnet test Jourfold.sln -c Release --no-build
      # Official packages sign in with the project's GitHub App. MSBuild reads the variable as a property (see
      # Directory.Build.props); builds without it ask for a client ID.
      - run: python eng/package.py --rid ${{ matrix.rid }}
        env:
          JourfoldGitHubClientId: ${{ vars.JOURFOLD_GITHUB_CLIENT_ID }}
          JourfoldGitHubAppSlug: ${{ vars.JOURFOLD_GITHUB_APP_SLUG }}
          # Files on GitHub releases tell about newer releases; see Directory.Build.props.
          JourfoldDistribution: github
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $arch = '${{ matrix.rid }}'.Substring(4)
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DAppVersion=$(python eng/version.py)" "/DAppUrl=$(python eng/version.py --website)" "/DArch=$arch" eng/windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          if-no-files-found: error
          path: |
            jourfold/artifacts/jourfold-${{ matrix.rid }}.tar.gz
            jourfold/artifacts/jourfold_*.deb
            jourfold/artifacts/jourfold-${{ matrix.rid }}.zip
            jourfold/artifacts/jourfold-setup-${{ matrix.rid }}.exe
  android:
    needs: version
    uses: ./.github/workflows/android.yml
    with:
      tag: ${{ github.event.release.tag_name || inputs.tag }}
      travelrepo: ${{ needs.version.outputs.travelrepo }}
    secrets: inherit
  ios:
    needs: version
    uses: ./.github/workflows/ios.yml
    with:
      tag: ${{ github.event.release.tag_name || inputs.tag }}
      travelrepo: ${{ needs.version.outputs.travelrepo }}
  publish:
    needs: [version, package, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Prepare install scripts and checksums
        run: |
          sed "s|@JOURFOLD_REPOSITORY@|${GITHUB_REPOSITORY}|g" install/install.sh > dist/install.sh
          sed "s|@JOURFOLD_REPOSITORY@|${GITHUB_REPOSITORY}|g" install/install.ps1 > dist/install.ps1
          chmod +x dist/install.sh
          cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Attach packages to the release
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
      - name: Turn the pre-release into a full release
        # Every published release starts as a pre-release (see the first step); once everything is attached, a tag
        # without a suffix (v1.2.3) becomes a full, latest release. Tags with a suffix (v1.2.3-beta.1) stay pre-releases.
        if: github.event_name == 'release' && !contains(env.TAG, '-')
        run: gh release edit "$TAG" --prerelease=false --latest --repo "$GITHUB_REPOSITORY"
  return-to-draft:
    needs: [version, package, android, ios, publish]
    if: failure() && github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Turn the release back into a draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$TAG" --draft=true --repo "$GITHUB_REPOSITORY"
          echo "::error::The release $TAG failed its checks and is a draft again. See the failed job above, fix it, then publish the release again."
