name: Release
# Runs when a maintainer publishes a GitHub release. The release tag must be v + <Version> from
# Directory.Build.props, and the TravelRepo release v + <TravelRepoVersion> must already exist; Jourfold is
# built against exactly that TravelRepo tag. The workflow builds Linux and Windows packages (x64 and ARM64)
# for the tagged commit and attaches them, SHA256SUMS and the one-line install scripts to the release:
#   curl -fsSL https://github.com/<owner>/<repo>/releases/latest/download/install.sh | bash
#   irm https://github.com/<owner>/<repo>/releases/latest/download/install.ps1 | iex
# Publish the release as a pre-release: the installers only use the latest full release, so they never see it
# before its files are attached. Afterwards, a tag without a suffix (v1.2.3) becomes a full, latest release; tags
# with a suffix (v1.2.3-beta.1) stay pre-releases. A release published as a full release also works: the previous
# release is kept as latest while the files are built. If anything fails, the release goes back to draft; fix the
# problem and publish it again.
#
# ARM64 packages are cross-compiled on x64 runners and not tested there. To build and test them natively, set the
# repository variables LINUX_ARM64_RUNNER (for example ubuntu-24.04-arm) and WINDOWS_ARM64_RUNNER (windows-11-arm).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of a published release to check and build again, for example v0.2.0
        required: true
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      travelrepo: ${{ steps.travelrepo.outputs.tag }}
      latest: ${{ steps.latest.outputs.latest }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          path: jourfold
      - id: travelrepo
        working-directory: jourfold
        env:
          REPO: ${{ vars.TRAVELREPO_REPOSITORY }}
        run: |
          tag="v$(python3 eng/version.py --travelrepo)"
          if ! git ls-remote --exit-code --tags "https://github.com/$REPO.git" "refs/tags/$tag" > /dev/null; then
            echo "::error::Jourfold needs TravelRepo $tag (TravelRepoVersion), but $REPO has no such tag. Publish that TravelRepo release first."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.TRAVELREPO_REPOSITORY }}
          ref: ${{ steps.travelrepo.outputs.tag }}
          path: travelrepo
      - working-directory: jourfold
        run: python3 eng/version.py --check-tag "$TAG" --github
      - name: Title the release with its code name when it has no title
        if: github.event_name == 'release'
        working-directory: jourfold
        env:
          TITLE: ${{ github.event.release.name }}
        run: |
          name="$(python3 eng/version.py --codename)"
          echo "Code name: $name" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$TITLE" ] || [ "$TITLE" = "$TAG" ]; then
            # shellcheck disable=SC1111 # typographic quotes are part of the title
            gh release edit "$TAG" --title "Jourfold ${TAG#v} “$name”" --repo "$GITHUB_REPOSITORY"
          fi
      - id: latest
        name: Keep the previous release as latest until the packages are attached
        if: github.event.release.prerelease != true
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2> /dev/null || true)
          if [ "$latest" = "$TAG" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
            gh release edit "$TAG" --latest=false --repo "$GITHUB_REPOSITORY"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi
  package:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            arch: X64
            os: ubuntu-latest
          - rid: linux-arm64
            arch: ARM64
            os: ${{ vars.LINUX_ARM64_RUNNER || 'ubuntu-latest' }}
          - rid: win-x64
            arch: X64
            os: windows-latest
          - rid: win-arm64
            arch: ARM64
            os: ${{ vars.WINDOWS_ARM64_RUNNER || 'windows-latest' }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: jourfold
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          path: jourfold
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.TRAVELREPO_REPOSITORY }}
          ref: ${{ needs.version.outputs.travelrepo }}
          path: travelrepo
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: jourfold/global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: dotnet restore --locked-mode
      - run: dotnet build Jourfold.sln -c Release --no-restore
      # Tests run where the runner matches the package architecture.
      - if: runner.arch == matrix.arch
        run: dotnet test Jourfold.sln -c Release --no-build
      - run: python eng/package.py --rid ${{ matrix.rid }}
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $arch = '${{ matrix.rid }}'.Substring(4)
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DAppVersion=$(python eng/version.py)" "/DArch=$arch" eng/windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          if-no-files-found: error
          path: |
            jourfold/artifacts/jourfold-${{ matrix.rid }}.tar.gz
            jourfold/artifacts/jourfold_*.deb
            jourfold/artifacts/jourfold-${{ matrix.rid }}.zip
            jourfold/artifacts/jourfold-setup-${{ matrix.rid }}.exe
  publish:
    needs: [version, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Prepare install scripts and checksums
        run: |
          sed "s|@JOURFOLD_REPOSITORY@|${GITHUB_REPOSITORY}|g" install/install.sh > dist/install.sh
          sed "s|@JOURFOLD_REPOSITORY@|${GITHUB_REPOSITORY}|g" install/install.ps1 > dist/install.ps1
          chmod +x dist/install.sh
          cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Attach packages to the release
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
      - name: Turn the pre-release into a full release
        # Publish as a pre-release; once everything is attached, a tag without a suffix (v1.2.3) becomes a full,
        # latest release. Tags with a suffix (v1.2.3-beta.1) stay pre-releases.
        if: github.event_name == 'release' && github.event.release.prerelease && !contains(env.TAG, '-')
        run: gh release edit "$TAG" --prerelease=false --latest --repo "$GITHUB_REPOSITORY"
      - name: Make the release latest again
        if: needs.version.outputs.latest == 'true'
        run: gh release edit "$TAG" --latest --repo "$GITHUB_REPOSITORY"
  return-to-draft:
    needs: [version, package, publish]
    if: failure() && github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Turn the release back into a draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$TAG" --draft=true --repo "$GITHUB_REPOSITORY"
          echo "::error::The release $TAG failed its checks and is a draft again. See the failed job above, fix it, then publish the release again."
