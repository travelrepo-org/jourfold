# Release notes for Jourfold 0.10.0. "highlights" appear once in the app after the update; all sections go into
# CHANGELOG.md and the GitHub release. English is required; other languages fall back to English.
version: 0.10.0
date: 2026-11-11
highlights:
  - icon: wallet
    en: Costs are reworked. A trip has one currency for its totals, its budget and who owes whom. What a card charged stays exact; everything else is estimated with the day's rates and marked as such. A booking costs what its payments come to, paid or still to pay with a due date.
    de: Die Kosten sind neu aufgebaut. Eine Reise hat eine Währung für ihre Summen, ihr Budget und wer wem etwas schuldet. Was eine Karte abgebucht hat, bleibt genau; alles andere wird mit den Kursen des Tages geschätzt und so gekennzeichnet. Eine Buchung kostet, was ihre Zahlungen ergeben, bezahlt oder noch zu zahlen mit Fälligkeitsdatum.
  - icon: users
    en: Expenses are divided equally, by amounts, by shares or in percent. Who owes whom shows one line per person, and "Pay back…" settles it with the fewest payments.
    de: Ausgaben werden gleich, nach Beträgen, nach Anteilen oder in Prozent aufgeteilt. „Wer schuldet wem“ zeigt eine Zeile pro Person, und „Zurückzahlen …“ gleicht alles mit den wenigsten Zahlungen aus.
  - icon: smartphone
    en: Phones and tablets have the full Costs page too, with budgets, splits, paying back and the search. Today lists payments that are due soon.
    de: Auch Handys und Tablets haben die ganze Kostenseite, mit Budgets, Aufteilungen, Zurückzahlen und der Suche. „Heute“ zeigt Zahlungen, die bald fällig sind.
changes:
  - en: Adding an expense asks for everything at once, on the computer and on phones and tablets. That covers the amount and what the card charged, whether it is still to pay with a due date or the day it was paid, and who paid. It also covers what it belongs to, the category, the split and a receipt. It can only be added once the split adds up.
    de: Beim Hinzufügen einer Ausgabe wird alles auf einmal abgefragt, am Computer und auf Handys und Tablets. Dazu gehören der Betrag und was die Karte abgebucht hat, ob sie noch zu zahlen ist mit Fälligkeitsdatum oder an welchem Tag sie bezahlt wurde, und wer bezahlt hat. Dazu gehören auch, wozu sie gehört, die Kategorie, die Aufteilung und ein Beleg. Hinzufügen geht erst, wenn die Aufteilung aufgeht.
  - en: A trip has one budget, and more budgets can be limited to a category, a person or a collection. When you change the trip currency, Jourfold offers to convert budgets in the old one. A budget that cannot be converted yet is shown in its own currency.
    de: Eine Reise hat ein Budget, und weitere Budgets lassen sich auf eine Kategorie, eine Person oder eine Sammlung beschränken. Wenn Sie die Reisewährung ändern, bietet Jourfold an, Budgets in der alten Währung umzurechnen. Ein Budget, das sich noch nicht umrechnen lässt, steht in seiner eigenen Währung.
  - en: Payments are listed by day. A search finds them by name, category, the people involved, and the booking or place they belong to.
    de: Zahlungen stehen nach Tagen geordnet. Eine Suche findet sie nach Name, Kategorie, beteiligten Personen und der Buchung oder dem Ort, zu dem sie gehören.
  - en: Costs can be exported on the computer as PDF, as CSV with a chosen separator, or as text, for everyone or for the part of chosen people.
    de: Die Kosten lassen sich am Computer als PDF, als CSV mit wählbarem Trennzeichen oder als Text exportieren, für alle oder für den Anteil ausgewählter Personen.
  - en: When a trip has costs from an older version, Jourfold offers to bring them up to date and lists what changes. Booking prices become payments still to pay, and nothing that was paid, owed or paid back changes. If you put it off, the Costs page offers it again.
    de: Hat eine Reise Kosten aus einer älteren Version, bietet Jourfold an, sie auf den neuen Stand zu bringen, und zeigt, was sich ändert. Buchungspreise werden noch offene Zahlungen, und nichts, was bezahlt, geschuldet oder zurückgezahlt wurde, ändert sich. Schieben Sie es auf, bietet die Kostenseite es erneut an.
  - en: Amounts are shown with the decimals of their currency, so yen have none. You are marked "(You)" everywhere, and the German texts consistently say "Sie".
    de: Beträge erscheinen mit den Nachkommastellen ihrer Währung, Yen also ohne. Sie sind überall mit „(Sie)“ gekennzeichnet, und die deutschen Texte sagen durchgehend „Sie“.
  - en: On phones and tablets, amounts open the number keyboard. Tapping beside a field or scrolling the page closes the keyboard.
    de: Auf Handys und Tablets öffnen Beträge die Zifferntastatur. Ein Tippen neben ein Feld oder Scrollen der Seite schließt die Tastatur.
  - en: On phones and tablets, the GitHub sign-in code can be copied again with "Copy code" or by holding it, for when GitHub's own sign-in has replaced the clipboard.
    de: Auf Handys und Tablets lässt sich der GitHub-Anmeldecode mit „Code kopieren“ oder durch langes Drücken erneut kopieren, falls die Anmeldung bei GitHub die Zwischenablage überschrieben hat.
fixes:
  - en: Attached e-mails keep their line endings, whatever Git is set to convert. On a Mac set to convert them, every other copy of the trip reported the e-mail as damaged and refused all changes. The computer that attached the e-mail repairs the trip with its next saved version, for example when you agree to update the costs. Other copies are repaired by downloading the trip again.
    de: Angehängte E-Mails behalten ihre Zeilenenden, egal was Git umwandeln soll. Auf einem Mac, der sie umwandelt, meldete jede andere Kopie der Reise die E-Mail als beschädigt und lehnte alle Änderungen ab. Der Computer, der die E-Mail angehängt hat, repariert die Reise mit der nächsten gespeicherten Version, zum Beispiel wenn Sie dem Aktualisieren der Kosten zustimmen. Andere Kopien werden repariert, indem Sie die Reise neu herunterladen.
  - en: Phones and tablets explain a failed change instead of closing, for example "This is me" in a trip with errors. Unexpected errors are written to a log on the device and nothing is sent. Today shows a card when the open trip has errors.
    de: Handys und Tablets erklären eine fehlgeschlagene Änderung, statt sich zu schließen, etwa bei „Das bin ich“ in einer Reise mit Fehlern. Unerwartete Fehler werden in ein Protokoll auf dem Gerät geschrieben, und nichts wird gesendet. „Heute“ zeigt eine Karte, wenn die geöffnete Reise Fehler hat.
  - en: The place search reads a hotel network's sign-in page as a network problem instead of failing, and leaves out results without a name or position.
    de: Die Ortssuche wertet die Anmeldeseite eines Hotelnetzes als Netzwerkproblem, statt zu scheitern, und lässt Ergebnisse ohne Namen oder Position weg.
  - en: Street maps load on the first draw. Before, they could stay empty until something drew the map again.
    de: Straßenkarten laden beim ersten Zeichnen. Bisher konnten sie leer bleiben, bis die Karte erneut gezeichnet wurde.
  - en: The currency picker shows the yen sign correctly, and a booking's reference is labelled "Booking number".
    de: Die Währungsauswahl zeigt das Yen-Zeichen richtig, und die Referenz einer Buchung heißt „Buchungsnummer“.
